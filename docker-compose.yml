name: pebble-metrics-lab

services:
  app:
    build:
      context: ./app
      additional_contexts:
        # Pebble source tree to build from (your local fork by default).
        pebble: ${PEBBLE_SRC:-../pebble}
    image: pebble-metrics-lab-app:dev
    container_name: metrics-lab-app
    environment:
      WORKER_CRASH_AFTER_S: ${WORKER_CRASH_AFTER_S:-30}
      WORKER_LEAK_MB_PER_S: ${WORKER_LEAK_MB_PER_S:-1}
      WORKER_CPU_PERCENT: ${WORKER_CPU_PERCENT:-20}
    ports:
      - "4000:4000" # Pebble HTTP API (/v1/metrics, /v1/health)
      - "8080:8080" # web service

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
      # cAdvisor samples carry explicit timestamps, so series of removed
      # containers never go stale; a short lookback hides them after 30s.
      - --query.lookback-delta=30s
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --allow_dynamic_housekeeping=false
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pebble-lab.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
