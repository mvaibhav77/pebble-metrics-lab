global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pebble
    metrics_path: /v1/metrics
    # Pebble sets no explicit Content-Type on /v1/metrics (Go sniffs
    # text/plain), so pin the format Prometheus should parse it as.
    fallback_scrape_protocol: PrometheusText0.0.4
    basic_auth:
      username: metrics-lab
      password: pebble-lab-dev # dev-only, see app/identities.yaml
    static_configs:
      - targets: ["app:4000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|memory_usage_bytes|memory_cache|start_time_seconds|last_seen)|machine_.*
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
